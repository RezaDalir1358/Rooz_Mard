<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>روزت مبارک آقا رضا</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#000000" />

<style>
@font-face{
  font-family: Vazir;
  src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/Vazir.woff');
  font-display: swap; /* ✅ لود بهتر فونت */
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Vazir, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

body{
  background:#000;
  color:#fff;
  /* ❌ overflow:hidden رو از body برداشتیم تا روی موبایل گیر نکنه */
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

/* ویدیو بک‌گراند */
video{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  filter: blur(3px) brightness(.45);
  z-index:-10;
  transform: translateZ(0); /* ✅ رندر روان‌تر */
}

/* ✅ همون حس قبلی، فقط یکم استانداردتر */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:-9;
}

/* تیتر */
.header{
  margin-top:20px;
  text-align:center;
  font-size:28px;
  text-shadow:0 2px 20px rgba(0,0,0,.6);
}

/* کانتینر */
.container{
  /* ✅ 100vh روی موبایل پرش میده؛ این بهتره */
  min-height: calc(100svh - 160px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:24px;
  padding: 12px 0;
}

/* عکس */
.photo{
  width:220px;
  height:220px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 0 40px rgba(255,255,255,.12);
  animation:float 5s ease-in-out infinite;
}
@keyframes float{
  50%{transform:translateY(-12px)}
}

/* ===== دکمه موزیک ===== */
.music-btn{
  position:relative;
  width:84px;
  height:84px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:32px;
  display:grid;
  place-items:center;
  box-shadow:0 6px 20px rgba(0,0,0,.6);
  transition:transform .12s ease, box-shadow .12s ease, filter .2s ease;
  overflow:hidden;
  outline:none;
  user-select:none;
}
.music-btn:hover{ filter: brightness(1.05); }

.music-btn:active{
  transform:scale(.92);
  box-shadow:0 4px 14px rgba(0,0,0,.8);
}

/* ripple دقیق */
.music-btn::after{
  content:"";
  position:absolute;
  left:var(--x,50%);
  top:var(--y,50%);
  width:0;
  height:0;
  border-radius:50%;
  background:rgba(255,255,255,.35);
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.music-btn.ripple::after{
  animation:ripple .45s ease-out;
}

@keyframes ripple{
  from{width:0;height:0;opacity:.7}
  to{width:240px;height:240px;opacity:0}
}

/* حالت پخش */
.music-btn.playing{
  animation:playPulse 1.6s infinite;
}
@keyframes playPulse{
  50%{transform:scale(1.06)}
}

/* ساعت */
.clock{
  padding:10px 20px;
  border-radius:20px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(8px);
  font-size:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.6);
}

/* ===== تقویم ===== */
.mini-calendar{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
  text-align:center;
  font-size:12px;
  padding:10px 14px;
  background:rgba(0,0,0,.35);
  border-radius:14px;
  backdrop-filter:blur(6px);
  box-shadow:0 10px 40px rgba(0,0,0,.7);
  min-width:170px;
  z-index:5;
}

.mini-calendar::before{
  content:"";
  position:absolute;
  left:50%;
  bottom:-40px;
  transform:translateX(-50%);
  width:150px;
  height:150px;
  border-radius:50%;
  border:1px solid transparent;
  background:
    linear-gradient(#000,#000) padding-box,
    linear-gradient(120deg,rgba(255,255,255,.18),rgba(255,255,255,.02)) border-box;
  animation:rotateRing 12s linear infinite;
  pointer-events:none;
  z-index:-1;
  opacity:.55;
}

@keyframes rotateRing{
  to{transform:translateX(-50%) rotate(360deg)}
}

.mini-calendar .ym{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:6px;
  font-weight:600;
}

.mini-calendar table{
  margin:auto;
  border-collapse:collapse;
}
.mini-calendar th,
.mini-calendar td{
  width:22px;
  height:22px;
  text-align:center;
  font-size:12px;
}

/* قلب */
.mini-calendar .heart{
  position:relative;
  font-weight:700;
}
.mini-calendar .heart::after{
  content:"❤";
  position:absolute;
  top:-6px;
  left:50%;
  transform:translateX(-50%);
  font-size:14px;
  color:rgba(255,80,100,.95);
  text-shadow:0 0 8px rgba(255,80,100,.9);
}

/* موبایل */
@media(max-width:420px){
  .photo{width:160px;height:160px}
  .music-btn{width:68px;height:68px;font-size:26px}
  .mini-calendar{min-width:140px}
}

/* ✅ احترام به تنظیمات کاهش حرکت */
@media (prefers-reduced-motion: reduce){
  .photo, .music-btn.playing, .mini-calendar::before{ animation: none !important; }
}
</style>
</head>

<body>

<video autoplay muted loop playsinline preload="metadata" poster="Image/IMG_20260103_015659_114.jpg">
  <source src="Video/VID_20260103_051125_812.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="header">🌿 روزت مبارک آقا رضا 🌿</div>

<div class="container">
  <img src="Image/IMG_20260103_015659_114.jpg" class="photo" alt="عکس آقا رضا" loading="lazy">
  <button class="music-btn" id="musicBtn" aria-label="پخش یا توقف موزیک" title="پخش/توقف موزیک">🎶</button>
  <div class="clock" id="clock">--:--:--</div>
</div>

<div class="mini-calendar">
  <div class="ym"><span>دی</span><span>۱۴۰۴</span></div>
  <table>
    <tr><th>ش</th><th>ی</th><th>د</th><th>س</th><th>چ</th><th>پ</th><th>ج</th></tr>
    <tr><td></td><td></td><td>۱</td><td>۲</td><td>۳</td><td>۴</td><td>۵</td></tr>
    <tr><td>۶</td><td>۷</td><td>۸</td><td>۹</td><td>۱۰</td><td>۱۱</td><td>۱۲</td></tr>
    <tr><td class="heart">۱۳</td><td>۱۴</td><td>۱۵</td><td>۱۶</td><td>۱۷</td><td>۱۸</td><td>۱۹</td></tr>
    <tr><td>۲۰</td><td>۲۱</td><td>۲۲</td><td>۲۳</td><td>۲۴</td><td>۲۵</td><td>۲۶</td></tr>
    <tr><td>۲۷</td><td>۲۸</td><td>۲۹</td><td>۳۰</td><td></td><td></td><td></td></tr>
  </table>
</div>

<audio id="music" loop preload="none">
  <source src="Audio/pas-az-baran.mp3" type="audio/mpeg">
</audio>

<script>
  // ⏰ ساعت ایران (همون خودت، فقط تمیزتر)
  const clock = document.getElementById("clock");
  const tick = () => {
    clock.innerText =
      "ساعت ایران: " +
      new Date().toLocaleTimeString("fa-IR", { timeZone: "Asia/Tehran" });
  };
  tick();
  setInterval(tick, 1000);

  // 🎵 موزیک + ریپل (بدون پیام/alert مزاحم)
  const music = document.getElementById("music");
  const btn = document.getElementById("musicBtn");

  btn.addEventListener("pointerdown", async (e) => {
    const rect = btn.getBoundingClientRect();
    btn.style.setProperty("--x", (e.clientX - rect.left) + "px");
    btn.style.setProperty("--y", (e.clientY - rect.top) + "px");

    btn.classList.remove("ripple");
    void btn.offsetWidth;
    btn.classList.add("ripple");

    try {
      if (music.paused) {
        await music.play();         // ✅ جلوگیری از ارورهای مخفی موبایل
        btn.classList.add("playing");
      } else {
        music.pause();
        btn.classList.remove("playing");
      }
    } catch (_) {
      // ❌ هیچ پیامی نمایش نده؛ فقط حالت playing فعال نشه
      btn.classList.remove("playing");
    }
  });
</script>

</body>
</html>
