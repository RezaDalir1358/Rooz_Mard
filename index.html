<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#06070a" />
  <title>روزت مبارک آقا رضا</title>

  <!-- فونت Vazir (همون قبلی، فقط با swap برای لود بهتر) -->
  <style>
    @font-face{
      font-family:Vazir;
      src:url('https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/Vazir.woff');
      font-display: swap;
    }

    :root{
      --card: rgba(255,255,255,.10);
      --stroke: rgba(255,255,255,.18);
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.72);
      --accent1: rgba(255,77,109,.90);
      --accent2: rgba(124,77,255,.90);
    }

    *{ box-sizing:border-box; margin:0; padding:0; font-family:Vazir, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }

    body{
      min-height: 100svh;
      background:#000;
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -webkit-tap-highlight-color:transparent;
      overflow-x:hidden;
    }

    /* ویدیو بک‌گراند */
    video{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      filter: blur(3px) brightness(.45);
      z-index:-10;
      transform: translateZ(0);
    }

    .overlay{
      position:fixed;
      inset:0;
      background: radial-gradient(1200px 800px at 80% 10%, rgba(124,77,255,.18), transparent 55%),
                  radial-gradient(1000px 900px at 20% 90%, rgba(255,77,109,.18), transparent 55%),
                  rgba(0,0,0,.55);
      z-index:-9;
    }

    /* کارت مرکزی شیشه‌ای */
    .shell{
      min-height: 100svh;
      display:grid;
      place-items:center;
      padding: 18px;
    }

    .card{
      width:min(760px, 100%);
      background: var(--card);
      border:1px solid var(--stroke);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 22px 18px 18px;
      position:relative;
      overflow:hidden;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:-2px;
      background: linear-gradient(120deg, rgba(255,77,109,.22), rgba(124,77,255,.18), transparent 70%);
      opacity:.35;
      pointer-events:none;
    }

    /* تیتر */
    .header{
      text-align:center;
      font-size: clamp(22px, 3.8vw, 34px);
      text-shadow:0 2px 20px rgba(0,0,0,.6);
      margin-bottom: 14px;
      position:relative;
      z-index:1;
    }

    .container{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 18px;
      padding: 12px 0 8px;
      position:relative;
      z-index:1;
    }

    /* عکس */
    .photo-wrap{
      width: clamp(160px, 34vw, 230px);
      aspect-ratio: 1/1;
      border-radius: 999px;
      padding: 3px;
      background: linear-gradient(135deg, rgba(255,77,109,.75), rgba(124,77,255,.75));
      box-shadow: 0 18px 60px rgba(0,0,0,.55);
      animation: float 5s ease-in-out infinite;
    }

    .photo{
      width:100%;
      height:100%;
      border-radius:999px;
      object-fit:cover;
      display:block;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.2);
    }

    @keyframes float{ 50%{ transform: translateY(-10px);} }

    /* ===== دکمه موزیک ===== */
    .music-btn{
      position:relative;
      width: 84px;
      height: 84px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.16);
      cursor:pointer;
      background: rgba(255,255,255,.12);
      color:#fff;
      font-size:32px;
      display:grid;
      place-items:center;
      box-shadow:0 10px 34px rgba(0,0,0,.65);
      transition:transform .12s ease, box-shadow .12s ease, filter .2s ease;
      overflow:hidden;
      outline:none;
      user-select:none;
    }

    .music-btn:hover{ filter: brightness(1.05); }
    .music-btn:active{
      transform:scale(.92);
      box-shadow:0 6px 18px rgba(0,0,0,.8);
    }

    /* ripple دقیق */
    .music-btn::after{
      content:"";
      position:absolute;
      left:var(--x,50%);
      top:var(--y,50%);
      width:0;
      height:0;
      border-radius:50%;
      background:rgba(255,255,255,.35);
      transform:translate(-50%,-50%);
      pointer-events:none;
    }

    .music-btn.ripple::after{ animation:ripple .45s ease-out; }

    @keyframes ripple{
      from{ width:0; height:0; opacity:.7 }
      to{ width:260px; height:260px; opacity:0 }
    }

    /* حالت پخش */
    .music-btn.playing{
      background: linear-gradient(135deg, rgba(255,77,109,.35), rgba(124,77,255,.28));
      animation: playPulse 1.6s infinite;
    }
    @keyframes playPulse{ 50%{ transform: scale(1.06); } }

    /* ساعت */
    .clock{
      padding:10px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(8px);
      font-size: 14px;
      color: var(--muted);
      box-shadow: 0 10px 34px rgba(0,0,0,.55);
    }

    /* ===== تقویم ===== */
    .mini-calendar{
      margin-top: 10px;
      color:#fff;
      text-align:center;
      font-size:12px;
      padding: 12px 14px;
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      backdrop-filter: blur(8px);
      box-shadow: 0 14px 46px rgba(0,0,0,.60);
      width: min(360px, 100%);
      position:relative;
      overflow:hidden;
    }

    .mini-calendar::before{
      content:"";
      position:absolute;
      inset:-2px;
      background: linear-gradient(120deg, rgba(255,255,255,.12), rgba(255,255,255,.02), transparent 70%);
      opacity:.55;
      pointer-events:none;
    }

    .mini-calendar .ym{
      display:flex;
      justify-content:center;
      gap:10px;
      margin-bottom: 8px;
      font-weight:700;
      position:relative;
      z-index:1;
    }

    .mini-calendar table{
      margin:auto;
      border-collapse:collapse;
      position:relative;
      z-index:1;
    }

    .mini-calendar th,
    .mini-calendar td{
      width: 26px;
      height: 26px;
      text-align:center;
      font-size:12px;
      color: rgba(255,255,255,.86);
    }
    .mini-calendar th{ color: rgba(255,255,255,.72); font-weight:700; }

    /* قلب */
    .mini-calendar .heart{
      position:relative;
      font-weight:900;
      color:#fff;
    }
    .mini-calendar .heart::after{
      content:"❤";
      position:absolute;
      top:-8px;
      left:50%;
      transform:translateX(-50%);
      font-size:14px;
      color: rgba(255,80,100,.95);
      text-shadow:0 0 10px rgba(255,80,100,.9);
    }

    /* نوشته‌ی کوچیک زیر کارت */
    .footer-note{
      margin-top: 12px;
      text-align:center;
      font-size: 12px;
      color: rgba(255,255,255,.55);
      position:relative;
      z-index:1;
    }

    /* موبایل */
    @media(max-width:420px){
      .music-btn{ width:68px; height:68px; font-size:26px; }
      .mini-calendar th, .mini-calendar td{ width:24px; height:24px; }
    }

    @media (prefers-reduced-motion: reduce){
      *{ animation: none !important; transition:none !important; }
      video{ filter: brightness(.45); }
    }
  </style>
</head>

<body>
  <video autoplay muted loop playsinline preload="metadata" poster="Image/IMG_20260103_015659_114.jpg">
    <source src="Video/VID_20260103_051125_812.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <div class="shell">
    <main class="card">
      <div class="header">🌿 روزت مبارک آقا رضا 🌿</div>

      <div class="container">
        <div class="photo-wrap">
          <img src="Image/IMG_20260103_015659_114.jpg" class="photo" alt="عکس آقا رضا" loading="lazy">
        </div>

        <button class="music-btn" id="musicBtn" aria-label="پخش یا توقف موزیک" title="پخش/توقف موزیک">🎶</button>

        <div class="clock" id="clock">--:--:--</div>

        <section class="mini-calendar" aria-label="تقویم">
          <div class="ym"><span>دی</span><span>۱۴۰۴</span></div>
          <table>
            <tr><th>ش</th><th>ی</th><th>د</th><th>س</th><th>چ</th><th>پ</th><th>ج</th></tr>
            <tr><td></td><td></td><td>۱</td><td>۲</td><td>۳</td><td>۴</td><td>۵</td></tr>
            <tr><td>۶</td><td>۷</td><td>۸</td><td>۹</td><td>۱۰</td><td>۱۱</td><td>۱۲</td></tr>
            <tr><td class="heart">۱۳</td><td>۱۴</td><td>۱۵</td><td>۱۶</td><td>۱۷</td><td>۱۸</td><td>۱۹</td></tr>
            <tr><td>۲۰</td><td>۲۱</td><td>۲۲</td><td>۲۳</td><td>۲۴</td><td>۲۵</td><td>۲۶</td></tr>
            <tr><td>۲۷</td><td>۲۸</td><td>۲۹</td><td>۳۰</td><td></td><td></td><td></td></tr>
          </table>
        </section>

        <div class="footer-note">ساخته‌شده با عشق ❤️</div>
      </div>
    </main>
  </div>

  <audio id="music" loop preload="none">
    <source src="Audio/pas-az-baran.mp3" type="audio/mpeg">
  </audio>

  <script>
    // ساعت ایران
    const clock = document.getElementById("clock");
    const tick = () => {
      clock.innerText = "ساعت ایران: " + new Date().toLocaleTimeString("fa-IR", { timeZone:"Asia/Tehran" });
    };
    tick();
    setInterval(tick, 1000);

    // موزیک + ریپل
    const music = document.getElementById("music");
    const btn = document.getElementById("musicBtn");

    btn.addEventListener("pointerdown", async (e) => {
      const rect = btn.getBoundingClientRect();
      btn.style.setProperty("--x", (e.clientX - rect.left) + "px");
      btn.style.setProperty("--y", (e.clientY - rect.top) + "px");

      btn.classList.remove("ripple");
      void btn.offsetWidth;
      btn.classList.add("ripple");

      try{
        if (music.paused){
          await music.play();
          btn.classList.add("playing");
        } else {
          music.pause();
          btn.classList.remove("playing");
        }
      }catch(err){
        // بعضی موبایل‌ها/مرورگرها اجازه پخش رو سخت‌گیرانه میدن
        btn.classList.remove("playing");
        alert("برای پخش موزیک، یک‌بار روی دکمه بزن 🙂");
      }
    });
  </script>
</body>
</html>
